services:
  tomo:
    build:
      context: .
      dockerfile: Dockerfile
    image: tomo:latest
    container_name: tomo
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。改左边的数字来调整对外端口
      - "4000:4000"
    environment:
      # === 必改：生产环境务必设置以下三项 ===
      # 会话签名密钥（随机长字符串）
      TOMO_SESSION_SECRET: "${TOMO_SESSION_SECRET:?请在 .env 中设置 TOMO_SESSION_SECRET}"
      # 首次启动创建的管理员账号（之后请登录改密码）
      TOMO_ADMIN_USER: "${TOMO_ADMIN_USER:-admin}"
      TOMO_ADMIN_PASSWORD: "${TOMO_ADMIN_PASSWORD:?请在 .env 中设置 TOMO_ADMIN_PASSWORD}"

      # === 数据路径（映射到宿主机 ./appdata，一般不用改） ===
      TOMO_REPO_PATH: /data/tomo-docs
      TOMO_USERS_FILE: /data/users.json

      # === Git 提交作者信息 ===
      TOMO_GIT_AUTHOR_NAME: "${TOMO_GIT_AUTHOR_NAME:-Tomo}"
      TOMO_GIT_AUTHOR_EMAIL: "${TOMO_GIT_AUTHOR_EMAIL:-tomo@local}"

      PORT: "4000"
    volumes:
      # 绑定挂载：容器 /data 映射到部署目录下的 appdata/
      # 旧版 tomo-data 命名卷升级前请先按 README 迁移数据
      - ./appdata:/data
